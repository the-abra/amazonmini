version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: amazonmini_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecom_user
      MYSQL_PASSWORD: ecom_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Application (from GHCR image)
  app:
    image: ghcr.io/the-abra/amazonmini:latest
    container_name: amazonmini_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ecom_user
      DB_PASS: ecom_pass
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_YOUR_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_YOUR_KEY}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Application (local build - for development)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: amazonmini_app_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ecom_user
      DB_PASS: ecom_pass
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_YOUR_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_YOUR_KEY}
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
    profiles:
      - dev

volumes:
  db_data:
    driver: local
