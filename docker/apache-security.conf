# docker/apache-security.conf
# Defence in depth: even if .htaccess files are ignored, source/config directories are never served.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
</Directory>

<DirectoryMatch "^/var/www/html/(app|config|database|docker|scripts|tests|docs|\.git)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(Makefile|LICENSE|README\.md|.*\.(sql|sh|log|env))$">
    Require all denied
</FilesMatch>
