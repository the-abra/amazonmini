services:
  db:
    image: mariadb:10.11
    container_name: amazon_mini_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecom_user
      MYSQL_PASSWORD: ecom_pass
    ports:
      - "3306:3306"
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "ecom_user", "-pecom_pass"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amazon_mini_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ecom_user
      DB_PASS: ecom_pass
      APP_URL: http://localhost:8080
      APP_ENV: development
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_demo_secret}
    volumes:
      - ..:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: amazon_mini_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ecom_user
      PMA_PASSWORD: ecom_pass
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amazon_mini_tester
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ecom_user
      DB_PASS: ecom_pass
      APP_URL: http://localhost:8080
      APP_ENV: testing
      STRIPE_WEBHOOK_SECRET: whsec_local_demo_secret
    volumes:
      - ..:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["php", "tests/run_tests.php"]
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

volumes:
  db_data:
