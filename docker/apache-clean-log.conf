# docker/apache-clean-log.conf
# Suppress static assets (.css, .js, .svg, .png, etc.) from access log
# to ensure the developer terminal remains clean and readable.

SetEnvIf Request_URI "\.(?:gif|jpe?g|png|svg|ico|css|js|map|woff2?)$" dontlog

LogFormat "%h %l %u %t \"%r\" %>s %b" clean_format
CustomLog ${APACHE_LOG_DIR}/access.log clean_format env=!dontlog
ErrorLog ${APACHE_LOG_DIR}/error.log
