; docker/php.ini
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 10M
max_execution_time = 30

session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
